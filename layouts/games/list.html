{{ define "main" }}
<div class="games-catalog">
  <header class="portal-intro">
    <p class="portal-eyebrow">XAINOME / PLAYGROUND</p>
    <h1>{{ .Title }}</h1>
    <p>{{ .Description }}</p>
    <a class="portal-back" href="{{ "/" | relURL }}">← ブログのホームへ</a>
  </header>
  {{ with .Content }}<div class="post-content">{{ . }}</div>{{ end }}
  <section aria-label="遊べるゲーム" class="portal-game-grid">
    {{ range .RegularPagesRecursive.ByWeight }}
      {{ partial "portal/game-card.html" . }}
    {{ else }}
      <p>新しいゲームを準備中です。</p>
    {{ end }}
  </section>
</div>
{{ end }}
