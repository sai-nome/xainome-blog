{{ define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
  <div class="post-description">{{ .Description }}</div>
</header>
{{ with .Content }}<div class="post-content">{{ . }}</div>{{ end }}
{{ range .RegularPagesRecursive.ByWeight }}
<article class="post-entry">
  <header class="entry-header"><h2>{{ .Title }}</h2></header>
  <div class="entry-content"><p>{{ .Description }}</p></div>
  <footer class="entry-footer">{{ with .Params.genre }}{{ . }} · {{ end }}ゲームを開く →</footer>
  <a class="entry-link" href="{{ .RelPermalink }}" aria-label="{{ .Title }}を遊ぶ"></a>
</article>
{{ else }}
<p>新しいゲームを準備中です。</p>
{{ end }}
{{ end }}
