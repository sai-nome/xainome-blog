<dialog id="skill-tree-dialog" aria-labelledby="skill-tree-title" class="skill-tree-dialog">
  <header class="tree-header"><div><p class="eyebrow">RESEARCH / INDUSTRY / SPACE</p><h2 id="skill-tree-title">スキルツリー</h2><p>「購入」で設備・AIを導入し、「強化」で性能を育てます。購入可・強化可の枠をクリックしてください。</p></div><button type="button" class="icon-button" data-close="skill-tree-dialog" aria-label="スキルツリーを閉じる">×</button></header>
  <div class="tree-tabs" role="tablist" aria-label="購入と強化"><button type="button" id="tree-tab-purchase" role="tab" aria-controls="tree-map-panel" aria-selected="true">購入</button><button type="button" id="tree-tab-upgrade" role="tab" aria-controls="tree-map-panel" aria-selected="false" tabindex="-1">強化</button></div>
  <div class="tree-toolbar"><div class="tree-legend"><span class="done">● 取得済み</span><span class="ready">● 購入可・強化可</span><span class="waiting">● 資源不足</span><span class="locked">● 前提未達</span></div><div class="tree-zoom"><button type="button" data-tree-zoom="-10" aria-label="ツリーを縮小">−</button><output id="tree-zoom-value">100%</output><button type="button" data-tree-zoom="10" aria-label="ツリーを拡大">＋</button><button type="button" id="tree-locate">選択中の項目へ</button></div></div>
  <div class="tree-body">
    <div class="tree-map-column" id="tree-map-panel" role="tabpanel" aria-label="選択したタブのスキルマップ"><p class="tree-instructions"><kbd>Tab</kbd> 開閉 / <kbd>Esc</kbd> 閉じる / <kbd>矢印</kbd> 項目移動 / <kbd>Enter</kbd> 選択中の枠を実行。背景をドラッグ、またはスクロールで全体を見られます。</p><div id="tree-viewport" class="tree-viewport" aria-label="スキルツリーのマップ"><div id="tree-scaled-area"><div id="tree-canvas"><svg id="tree-links" aria-hidden="true"></svg><div id="tree-nodes"></div></div></div></div><p id="tree-progress" class="tree-progress"></p></div>
    <aside class="tree-detail" aria-labelledby="tree-detail-title"><div class="tree-detail-scroll"><span class="tree-detail-eyebrow">SELECTED SKILL</span><h3 id="tree-detail-title"></h3><p id="tree-detail-status"></p><p id="tree-detail-progress"></p><dl><dt>費用</dt><dd id="tree-detail-cost"></dd><dt>前提条件</dt><dd><ul id="tree-detail-requires"></ul></dd><dt>前提の項目へ移動</dt><dd id="tree-detail-parents" class="tree-parent-links"></dd><dt>得られるもの</dt><dd id="tree-detail-gain"></dd><dt>使い道・次の操作</dt><dd id="tree-detail-use"></dd></dl><p id="tree-detail-reason" role="status"></p></div><div class="tree-detail-actions"><button type="button" class="context-help" id="tree-detail-help">効果・使い道の詳しいヘルプ</button></div></aside>
  </div>
</dialog>
