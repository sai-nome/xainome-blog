baseURL = 'https://xainome.blog/'
title = 'Xainome Blog'
theme = 'PaperMod'
defaultContentLanguage = 'ja'

[params]
disableSpecial1stPost = true

[pagination]
pagerSize = 10

[[menu.main]]
identifier = 'posts'
name = '記事一覧'
url = '/posts/'
weight = 5

[[menu.main]]
identifier = 'games'
name = 'ゲーム'
url = '/games/'
weight = 10

[languages]
  [languages.ja]
    locale = 'ja-JP'
    label = 'Japanese'
    weight = 1

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
